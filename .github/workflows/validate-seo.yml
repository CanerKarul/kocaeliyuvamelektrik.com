name: Validate SEO and site build
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site from Python source
        run: |
          cd Kocaeli_Yuvam_Elektrik_Logo_Uyumlu_Web_Sitesi
          python3 -m py_compile build_site.py content_data.py
          python3 build_site.py

      - name: Validate generated pages, SEO data, consent analytics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('Kocaeli_Yuvam_Elektrik_Logo_Uyumlu_Web_Sitesi/site')
          pages = sorted(root.rglob('index.html'))
          assert len(pages) >= 32, f'At least 32 site pages required; got {len(pages)}'
          titles = []
          for page in pages:
              html = page.read_text(encoding='utf-8')
              assert html.count('<h1') == 1, page
              assert 'rel="canonical"' in html, page
              assert 'content="noindex' not in html, page
              title = re.search(r'<title>(.*?)</title>', html, re.S)
              assert title, page
              titles.append(title.group(1))
              data = [json.loads(x) for x in re.findall(
                  r'<script type="application/ld\+json">(.*?)</script>', html, re.S
              )]
              if page != root/'index.html':
                  assert any(d.get('@type') == 'BreadcrumbList' for d in data), page
              if page.parent.parent.name == 'hizmetler':
                  assert 'İlgili elektrik hizmetleri' in html, page
              if page.parent.parent.name == 'blog':
                  assert 'Bu konuda yerinde hizmet' in html, page
          assert len(set(titles)) == len(titles), 'Duplicate page titles'
          js = (root/'assets/site.js').read_text(encoding='utf-8')
          assert 'G-7XXDVG2JWK' in js and 'phone_click' in js, 'GA4 code missing'
          from xml.etree import ElementTree as ET
          sitemap = ET.parse(root / 'sitemap.xml')
          sitemap_urls = [
              (node.text or '').strip()
              for node in sitemap.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')
          ]
          expected_urls = {
              'https://kocaeliyuvamelektrik.com/' + page.relative_to(root).as_posix().removesuffix('index.html')
              for page in pages
          }
          assert len(sitemap_urls) == len(expected_urls), 'Sitemap page count differs from generated HTML pages'
          assert set(sitemap_urls) == expected_urls, 'Sitemap missing or unexpected canonical URLs'
          assert (root/'CNAME').exists(), 'Pages custom domain missing'
          print(f'PASS: {len(pages)} pages, unique titles, breadcrumbs, internal links, sitemap, GA4 and CNAME')
          PY
