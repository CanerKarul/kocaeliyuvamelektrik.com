name: Validate site generator and local SEO

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and validate key landing pages
        shell: bash
        run: |
          cd Kocaeli_Yuvam_Elektrik_Logo_Uyumlu_Web_Sitesi
          python3 -m py_compile build_site.py content_data.py
          python3 build_site.py
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape

          root = Path("site")
          home = unescape((root / "index.html").read_text(encoding="utf-8"))
          fault = unescape((root / "hizmetler/elektrik-ariza-tespiti-ve-tamiri/index.html").read_text(encoding="utf-8"))
          contact = unescape((root / "iletisim/index.html").read_text(encoding="utf-8"))

          assert len(list(root.rglob("index.html"))) >= 31, "Expected site pages missing"
          assert "İzmit Elektrikçi | Yerinde Servis" in home, "Homepage SEO title missing"
          assert "Evinize ve iş yerinize geliyoruz." in home, "On-site service promise missing"
          assert "7/24 telefonla ulaşabilirsiniz" in home, "24/7 contact distinction missing"
          assert "09.30–18.30" in home, "Planned service hours missing"
          assert "Pazar 12.00–17.00" in home, "Sunday 12-17 information missing from home"
          assert "Pazar 12.00–17.00" in fault, "Sunday 12-17 information missing from electrical fault page"
          assert "Pazar 12.00–17.00" in contact, "Sunday hours missing from contact page"
          assert '"dayOfWeek": "Sunday"' in home, "Sunday hours absent from LocalBusiness schema"
          assert '"opens": "12:00", "closes": "17:00"' in home, "Sunday 12-17 openingHoursSpecification missing"
          assert "Elektrik Arıza Tespiti ve Tamiri" in fault, "Fault landing page missing"
          assert "Gece acil elektrik arızasında" in fault, "Emergency explanation missing"
          assert "fiziksel dükkânda müşteri kabul etmiyoruz" in contact, "Service-area business info missing"
          assert "streetAddress" not in home, "Old private street address in structured data"
          assert "canonical" in home and "canonical" in fault, "Canonical tags missing"
          gmaps = "https://www.google.com/maps?cid=17157529544399427815"
          assert gmaps in home and gmaps in contact, "Public Google Business Profile link missing"
          assert '"hasMap"' in home and '"sameAs"' in home, "LocalBusiness Maps schema missing"
          assert (root / "sitemap.xml").exists(), "Sitemap missing"
          from xml.etree import ElementTree
          logo_svg = (root / "assets/yuvam-elektrik-logo.svg").read_text(encoding="utf-8")
          ElementTree.fromstring(logo_svg)
          assert 'M747,942 L797,942 C820,942' in logo_svg, "Corrected R glyph missing"
          assert 'id="banner" fill="#CB0109" d=' in logo_svg, "Solid red banner missing"
          assert 'yuvam-elektrik-logo.svg?v=20261115-r2' in home, "Header/hero logo cache version missing"
          assert 'yuvam-elektrik-logo.svg?v=20261115-r2' in fault, "Inner page logo cache version missing"

          print("OK: generated pages, truthful availability, hidden address and SEO metadata")
          PY
