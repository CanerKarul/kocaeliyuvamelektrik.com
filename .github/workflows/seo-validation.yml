name: Validate site generator and local SEO

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and validate key landing pages
        shell: bash
        run: |
          cd Kocaeli_Yuvam_Elektrik_Logo_Uyumlu_Web_Sitesi
          python3 -m py_compile build_site.py content_data.py
          python3 build_site.py
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape

          root = Path("site")
          home = unescape((root / "index.html").read_text(encoding="utf-8"))
          fault = unescape((root / "hizmetler/elektrik-ariza-tespiti-ve-tamiri/index.html").read_text(encoding="utf-8"))
          contact = unescape((root / "iletisim/index.html").read_text(encoding="utf-8"))

          assert len(list(root.rglob("index.html"))) >= 31, "Expected site pages missing"
          assert "İzmit Elektrikçi | 7/24 Elektrik Arıza" in home, "Homepage local-intent title missing"
          assert "Evinize ve iş yerinize geliyoruz." in home, "On-site service promise missing"
          assert 'class="brand" href="./"' in home, "Homepage logo must link to canonical root, not /index.html"
          assert '<a href="./" aria-current="page">Ana Sayfa</a>' in home, "Homepage navigation must use canonical root"
          assert 'class="brand" href="../../"' in fault, "Service-page logo must link to canonical homepage"
          assert '<a href="../../">Ana Sayfa</a>' in fault, "Service-page navigation must link to canonical root"
          assert "Google Haritalar’daki işletme profilimizden" in home, "Real Google review evidence link missing on homepage"
          assert "Bayram Canseven" in home, "Verified service contact should appear on homepage"
          assert "İzmit’te elektrikçi çağırmadan önce hangi bilgileri hazırlamalısınız?" in home, "Izmit electrician pre-call guidance missing"
          assert "Elektrik arıza tespiti ve tamiri" in home and "Sigorta ve kaçak akım rölesi kontrolü" in home, "Helpful service paths missing"
          review_url = "https://search.google.com/local/writereview?placeid=ChIJNWiF-ZRPyxQR55gyVTfKG-4"
          assert review_url in home and review_url in contact, "Authentic Google review invite link missing"
          assert "Hizmet aldıysanız değerlendirme bırakın" in home, "Footer review CTA missing"
          assert "Hizmetimiz hakkında görüşünüzü paylaşın" in contact, "Contact page review section missing"
          assert "olumlu veya olumsuz" in contact, "Review request must not be positive-only"
          assert "isteğe bağlıdır" in contact, "No-pressure review policy must be shown"
          assert "ödül veya indirim sunulmaz" in contact, "Reviews must not be incentivized"
          assert "İzmit’te acil elektrikçi çağırmadan önce" in fault, "Emergency search-intent guidance missing"
          assert "Elektrik arıza tespiti ve onarım ücreti nasıl belirlenir?" in fault, "Transparent pricing explanation missing"
          assert "24 saat" in home and "7/24" in home, "24-hour on-site service missing from homepage"
          assert "24 saat" in fault and "7/24" in fault, "24-hour service missing from fault page"
          assert "Her gün 24 saat açık" in contact, "24-hour working hours missing from contact"
          import json
          import re
          structured = [
              json.loads(x) for x in re.findall(
                  r'<script type="application/ld\+json">(.*?)</script>',
                  home, re.DOTALL
              )
          ]
          business = next(x for x in structured if x.get("@type") == "Electrician")
          area_names = [area.get("name", "") for area in business["areaServed"]]
          assert "İzmit Merkez, İzmit, Kocaeli, Türkiye" in area_names, "Izmit city service area missing"
          assert not any("Kocaeli Diğer İlçeler" in name for name in area_names), "Conditional district service area must not be asserted as Izmit"
          specs = business["openingHoursSpecification"]
          assert len(specs) == 1, "Expected one all-week opening hours spec"
          spec = specs[0]
          assert set(spec["dayOfWeek"]) == {"Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"}, "All seven days not covered"
          assert spec["opens"] == "00:00" and spec["closes"] == "23:59", "All-day opening hours incorrect"
          for legacy in ["09.30–18.30","12.00–17.00","09:30","18:30","12:00","17:00"]:
              assert legacy not in home and legacy not in fault and legacy not in contact, "Outdated working hours: " + legacy
          article_path = root / "blog/komsularda-elektrik-var-evde-yok/index.html"
          assert article_path.exists(), "New power outage guide missing"
          article = unescape(article_path.read_text(encoding="utf-8"))
          assert "Komşularda Elektrik Var, Evde Yok" in article, "Guide title missing"
          assert "Günün her saati" not in article or "24 saat" in article, "Guide availability claim inconsistent"
          assert "İzmit Elektrik Arıza Tamiri | Yuvam Elektrik" in fault, "Local service SEO title missing"
          assert "komsularda-elektrik-var-evde-yok/" in home and "komsularda-elektrik-var-evde-yok/" in fault, "Top landing pages need links to the guide"
          assert "../../hizmetler/elektrik-ariza-tespiti-ve-tamiri/" in article, "Guide must link to the repair service"
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          assert "/blog/komsularda-elektrik-var-evde-yok/" in sitemap, "New article missing from sitemap"
          assert "<h2>Elektrik arıza, bakım ve montaj hizmetleri</h2>" in (root / "hizmetler/index.html").read_text(encoding="utf-8"), "Services section heading missing"
          assert "<h2>Elektrik arızası ve güvenli kullanım rehberleri</h2>" in (root / "blog/index.html").read_text(encoding="utf-8"), "Blog section heading missing"
          assert "Elektrik Arıza Tespiti ve Tamiri" in fault, "Fault landing page missing"
          assert "Gece acil elektrik arızasında" in fault, "Emergency explanation missing"
          assert "fiziksel dükkânda müşteri kabul etmiyoruz" in contact, "Service-area business info missing"
          assert "streetAddress" not in home, "Old private street address in structured data"
          assert "canonical" in home and "canonical" in fault, "Canonical tags missing"
          gmaps = "https://www.google.com/maps?cid=17157529544399427815"
          assert gmaps in home and gmaps in contact, "Public Google Business Profile link missing"
          assert '"hasMap"' in home and '"sameAs"' in home, "LocalBusiness Maps schema missing"
          assert (root / "sitemap.xml").exists(), "Sitemap missing"
          from xml.etree import ElementTree
          logo_svg = (root / "assets/yuvam-elektrik-logo.svg").read_text(encoding="utf-8")
          ElementTree.fromstring(logo_svg)
          assert 'M747,942 L797,942 C820,942' in logo_svg, "Corrected R glyph missing"
          assert 'id="banner" fill="#CB0109" d=' in logo_svg, "Solid red banner missing"
          assert 'yuvam-elektrik-logo.svg?v=20261115-r2' in home, "Header/hero logo cache version missing"
          assert 'yuvam-elektrik-logo.svg?v=20261115-r2' in fault, "Inner page logo cache version missing"

          print("OK: generated pages, truthful availability, hidden address and SEO metadata")
          PY
